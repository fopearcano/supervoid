# SUPERVOID reverse proxy — LibreChat location block.
#
# Include this inside the SUPERVOID reverse-proxy `server { ... }` (the same
# nginx that fronts the SUPERVOID SPA + /api). The reverse proxy must join the
# `supervoid-brain` network so it can reach the `supervoid-librechat` container.
#
# Security boundary:
#   * ONLY LibreChat is exposed publicly, under /chat/. The Brain Gateway
#     (/brain) and the MCP server (/mcp) are NEVER proxied to the internet —
#     they are reachable only inside the private network. Do NOT add public
#     location blocks for /brain or /mcp.
#   * LibreChat itself binds to loopback in the compose file; this proxy is the
#     only ingress.

location /chat/ {
    proxy_pass         http://supervoid-librechat:3080/;
    proxy_http_version 1.1;

    # LibreChat uses Server-Sent Events / WebSocket upgrades for streaming.
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Streaming responses must not be buffered.
    proxy_buffering    off;
    proxy_read_timeout 300s;

    # Match LibreChat's upload ceiling (see librechat.yaml fileConfig).
    client_max_body_size 25m;
}

# Explicitly refuse any public attempt to reach the governed internal surfaces
# through this proxy (defence in depth — they should not be proxied at all).
location /brain/ { return 404; }
location /mcp    { return 404; }
