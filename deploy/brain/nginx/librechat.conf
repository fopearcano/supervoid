# SUPERVOID reverse proxy — Brain (LibreChat) + hand-off location blocks.
#
# Reference snippet for a standalone reverse proxy. The canonical, shipped config
# is the SUPERVOID frontend's nginx (frontend/nginx.conf), which already includes
# equivalent blocks. Include this only if you run a separate proxy. The proxy must
# join the `supervoid-brain` network to reach the containers below.
#
# Security boundary:
#   * Public ingress is ONLY the Brain UI (/brain/) and the token-authenticated
#     hand-off landing (/brain-handoff). The Brain Gateway (/brain/v1,
#     /brain/health) and the MCP server (/mcp) are NEVER proxied to the internet.
#   * Hosting LibreChat under a sub-path needs its base-path/DOMAIN config; a
#     dedicated internal subdomain is the simpler alternative.

resolver 127.0.0.11 valid=30s ipv6=off;

# The "Ask the Brain" hand-off landing — token-authenticated; 303 -> Brain UI.
location = /brain-handoff {
    proxy_pass         http://supervoid-backend:8000/brain-handoff$is_args$args;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

# Governed internal surfaces — never public (defence in depth).
location ^~ /brain/v1    { return 404; }
location = /brain/health { return 404; }
location = /mcp          { return 404; }

# LibreChat (the member-facing Brain UI), served at /brain/.
location ^~ /brain/ {
    set $librechat "supervoid-librechat:3080";
    proxy_pass         http://$librechat/;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;       # SSE / WebSocket
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_buffering    off;
    proxy_read_timeout 300s;
    client_max_body_size 25m;
}
