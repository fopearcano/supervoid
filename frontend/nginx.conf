server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, so the LibreChat upstream is resolved lazily at
    # request time — this container still starts when the brain stack is absent
    # (a /brain/ request just 502s until LibreChat is up).
    resolver 127.0.0.11 valid=30s ipv6=off;

    # --- Private navigation into the Brain (Prompt 12) --------------------
    # The "Ask the Brain" hand-off landing. Token-authenticated; it 303-redirects
    # to the Brain UI. Exact match so it never collides with /brain/ below.
    location = /brain-handoff {
        proxy_pass         http://backend:8000/brain-handoff$is_args$args;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # The governed service surfaces are NEVER public. They are reachable only on
    # the private network (LibreChat -> backend). Refuse them here defensively.
    location ^~ /brain/v1   { return 404; }
    location = /brain/health { return 404; }
    location = /mcp         { return 404; }

    # LibreChat (the member-facing Brain UI), served at /brain/. NOTE: hosting
    # LibreChat under a sub-path requires its base-path/DOMAIN config; a dedicated
    # internal subdomain is the simpler alternative (set librechat_public_url to
    # it). The $librechat variable + resolver keep this optional at runtime.
    location ^~ /brain/ {
        set $librechat "supervoid-librechat:3080";
        proxy_pass         http://$librechat/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;   # SSE / WebSocket
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 300s;
        client_max_body_size 25m;
    }

    # Backend lives at the `backend` service in docker-compose; in
    # production point this at whatever proxies the API.
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_pass_request_headers on;
    }

    # Public Graphic Novel Webviewer API + local demo media. Read-only and
    # unauthenticated; served by the backend, NOT the SPA. Declared before the
    # SPA fallback so /public/* never resolves to index.html. (The reader UI
    # itself lives at /reader/* and is handled by the SPA fallback below.)
    location /public/ {
        proxy_pass         http://backend:8000/public/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Single-page app fallback so deep links resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A short cache window for the immutable Vite assets.
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
