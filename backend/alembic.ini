# Alembic configuration for SUPERVOID Publishing.
#
# The database URL is intentionally left blank here: env.py resolves it from
# the application settings (DATABASE_URL / settings.database_url) so there is a
# single source of truth and no credentials live in this file. A url passed
# programmatically (app.migrations.alembic_config) takes precedence.

[alembic]
script_location = alembic
prepend_sys_path = .
# Resolved at runtime in env.py — do not hardcode here.
sqlalchemy.url =

# Use a stable, sortable revision id format for new revisions.
# (The baseline uses an explicit rev id of 0001_baseline.)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
